<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e6a4e">
<title>わが家の買い物メモ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=M+PLUS+1+Code:wght@400;600&display=swap">
<style>
/* Layout: one column phone list — sticky search header, tag chips, grouped rows with steppers, fixed action dock; receipt results shown as a paper slip */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --ink: #1c2420;
  --muted: #66716a;
  --line: #dde3dc;
  --accent: #2e6a4e;
  --accent-ink: #ffffff;
  --accent-soft: #e2eee6;
  --danger: #b4412f;
  --paper: #fffdf7;
  --paper-ink: #2b2a26;
  --t-veg: #4f8a3c; --t-fruit: #d0782a; --t-meat: #b8504a; --t-dairy: #c9a227;
  --t-drink: #3a7fb0; --t-season: #8a6a45; --t-snack: #c45c8e; --t-daily: #6a6fb5; --t-other: #8c948e;
  --f-display: "Kiwi Maru", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-receipt: "M PLUS 1 Code", "Osaka-Mono", "MS Gothic", monospace;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141917; --surface: #1d2421; --ink: #e8ede9; --muted: #9aa69f; --line: #2d3632;
    --accent: #6cbf93; --accent-ink: #0f1a14; --accent-soft: #23362c; --danger: #f08a77;
    --paper: #26251f; --paper-ink: #ece8dc;
    --t-veg: #7fbf6a; --t-fruit: #f0a35e; --t-meat: #e5847d; --t-dairy: #e4c35a;
    --t-drink: #6fb1df; --t-season: #c19b72; --t-snack: #e48cb8; --t-daily: #9ea3e6; --t-other: #a3aba5;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 8px; display: grid; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 1.45rem; letter-spacing: .02em; }
.brand .side { display: flex; align-items: center; gap: 6px; }
.brand .sum { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
.search input { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 0 40px 0 38px; }
.search input::placeholder { color: var(--muted); }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 1.1rem; }

.tagbar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tagbar::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .88rem; white-space: nowrap; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .8rem; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--t-other)); flex: none; }

.notice { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: .88rem; }
.notice button { margin-left: 6px; border: 0; background: none; color: var(--accent); font-weight: 700; text-decoration: underline; padding: 0; }
.list { display: grid; gap: 18px; padding-top: 8px; }
.group h2 { margin: 0 0 6px; display: flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 6px 6px 6px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .name { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 0; font-size: 1.02rem; overflow-wrap: anywhere; }
.row .name small { display: block; font-size: .72rem; color: var(--muted); }
.row.zero .name, .row.zero .qty { color: var(--muted); }
.row.zero .name span { text-decoration: line-through; text-decoration-color: var(--line); }
.stepper { flex: none; display: flex; align-items: center; gap: 2px; }
.stepper button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 1.25rem; line-height: 1; display: grid; place-items: center; }
.stepper button:active { background: var(--accent-soft); }
.stepper button:disabled { opacity: .35; }
.qty { min-width: 2.4em; text-align: center; font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--f-display); font-weight: 500; font-size: 1.15rem; margin-bottom: 6px; }
.welcome { display: grid; gap: 14px; padding: 40px 4px; text-align: center; }
.welcome p { margin: 0; color: var(--muted); }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(to top, var(--bg) 70%, transparent);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dock .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.btn { min-height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; text-decoration: none; }
.btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .45; }
.btn.big { min-height: 64px; font-size: 1.05rem; }

.backdrop { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .38); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
.sheet h3 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 1.2rem; }
.field { display: grid; gap: 6px; }
.field > span { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .05em; }
.field input[type="text"], .field input[type="password"] { height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 0 12px; width: 100%; min-width: 0; }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; }
.inline .btn { min-height: 46px; border-radius: 12px; }
.tagpick { display: flex; flex-wrap: wrap; gap: 8px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stack { display: grid; gap: 10px; }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }
.hint a { color: var(--accent); }
.linkbox { font-family: var(--f-receipt); font-size: .78rem; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow-wrap: anywhere; user-select: all; }

/* receipt slip */
.slip { background: var(--paper); color: var(--paper-ink); font-family: var(--f-receipt); border-radius: 4px; padding: 14px 12px 18px; border: 1px dashed var(--line);
  -webkit-mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 0 / 14px 100% repeat-x;
          mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 0 / 14px 100% repeat-x; }
.slip .head { text-align: center; font-size: .8rem; letter-spacing: .2em; border-bottom: 1px dashed currentColor; padding-bottom: 8px; margin-bottom: 4px; }
.rline { display: grid; grid-template-columns: 28px 1fr auto; gap: 6px 8px; align-items: center; padding: 8px 0; border-bottom: 1px dotted var(--line); }
.rline input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
.rline .rname { width: 100%; min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: transparent; padding: 0 8px; font-family: var(--f-body); }
.rline .rmeta { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .78rem; }
.rline select { height: 32px; border: 1px solid var(--line); border-radius: 8px; background: transparent; padding: 0 6px; font-family: var(--f-body); font-size: .85rem; max-width: 100%; }
.rline .stepper button { width: 34px; height: 34px; font-size: 1.05rem; }
.rline.off { opacity: .45; }
.badge { padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; font-size: .72rem; white-space: nowrap; }
.badge.merge { color: var(--accent); }
.preview { width: 72px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); flex: none; }
.reading { display: flex; gap: 14px; align-items: center; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; max-width: calc(100% - 32px); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>わが家の買い物メモ</h1>
      <div class="side">
        <span class="sum" id="sum"></span>
        <button class="iconbtn" id="setBtn" type="button" aria-label="設定と家族の招待" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
    <div id="toolbar" hidden>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="リストを検索（例: とまと）" autocomplete="off" aria-label="リストを検索">
        <button class="clear" id="qclear" type="button" aria-label="検索をクリア" hidden>×</button>
      </label>
      <nav class="tagbar" id="tagbar" aria-label="タグで絞り込み" style="margin-top:10px"></nav>
    </div>
  </header>
  <p class="notice" id="notice" hidden></p>
  <main class="list" id="list">
    <div class="empty"><strong>読み込んでいます</strong>少しお待ちください。</div>
  </main>
</div>

<div class="dock" id="dock" hidden>
  <div class="inner">
    <button class="btn" id="addBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>手で追加
    </button>
    <button class="btn primary" id="receiptBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>レシートで追加
    </button>
  </div>
</div>
<!-- capture 付きはカメラをその場で起動、なしは写真フォルダから選ぶ -->
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
<input id="galleryInput" type="file" accept="image/*" hidden>

<div class="backdrop" id="pickBack" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <h3 id="pickTitle">レシートの写真</h3>
    <div class="stack">
      <button class="btn primary big" type="button" id="pickCamera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>カメラで撮る
      </button>
      <button class="btn big" type="button" id="pickGallery">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>写真フォルダから選ぶ
      </button>
      <button class="btn" type="button" id="pickCancel">やめる</button>
    </div>
    <p class="hint">レシート全体がまっすぐ写るように、明るい場所で撮ってください。</p>
  </div>
</div>

<div class="backdrop" id="editBack" hidden>
  <form class="sheet" id="editForm" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <h3 id="editTitle">項目を追加</h3>
    <label class="field"><span>項目名</span><input id="fName" type="text" required placeholder="例: とまと" autocomplete="off"></label>
    <div class="field"><span>個数</span>
      <div class="stepper"><button type="button" id="fMinus" aria-label="1つ減らす">−</button><span class="qty" id="fQty">1</span><button type="button" id="fPlus" aria-label="1つ増やす">＋</button></div>
    </div>
    <div class="field"><span>タグ</span>
      <div class="tagpick" id="fTags"></div>
      <input id="fNewTag" type="text" placeholder="新しいタグを作る（例: ペット用品）" autocomplete="off">
    </div>
    <p class="hint" id="fHint" hidden></p>
    <div class="actions">
      <button class="btn" type="button" id="fCancel">やめる</button>
      <button class="btn primary" type="submit" id="fSave">保存</button>
    </div>
    <button class="btn danger" type="button" id="fDelete" hidden>この項目を削除</button>
  </form>
</div>

<div class="backdrop" id="setBack" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h3 id="setTitle">設定</h3>
    <div class="field"><span>家族を招待</span>
      <p class="hint">このリンクを家族に送って開いてもらうと、同じリストを一緒に使えます。リンクを知っている人は誰でも見たり書いたりできるので、家族以外には送らないでください。</p>
      <div class="linkbox" id="inviteLink"></div>
      <div class="actions">
        <button class="btn" type="button" id="copyLink">リンクをコピー</button>
        <button class="btn primary" type="button" id="shareLink">LINEなどで送る</button>
      </div>
    </div>
    <div class="field"><span>レシート読み取りのキー（Gemini API キー）</span>
      <p class="hint">一度入れると家族全員のスマホで使えます。キーは <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> で無料で作れます。</p>
      <div class="inline">
        <input id="keyInput" type="password" placeholder="AIza で始まる文字列" autocomplete="off" aria-label="Gemini API キー">
        <button class="btn primary" type="button" id="keySave">保存</button>
      </div>
      <p class="hint" id="keyState"></p>
    </div>
    <button class="btn" type="button" id="setClose">閉じる</button>
  </div>
</div>

<div class="backdrop" id="rcBack" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rcTitle">
    <h3 id="rcTitle">レシートの読み取り</h3>
    <div id="rcBody"></div>
    <div class="actions" id="rcActions"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, setDoc, increment, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { FIREBASE_CONFIG, GEMINI_MODEL } from "./config.js";

const DEFAULT_TAGS = ["野菜", "果物", "肉・魚", "乳製品・卵", "飲み物", "調味料", "お菓子", "日用品・消耗品", "その他"];
const TAG_COLORS = { "野菜": "--t-veg", "果物": "--t-fruit", "肉・魚": "--t-meat", "乳製品・卵": "--t-dairy", "飲み物": "--t-drink", "調味料": "--t-season", "お菓子": "--t-snack", "日用品・消耗品": "--t-daily", "その他": "--t-other" };
const EXTRA_COLORS = ["--t-veg", "--t-fruit", "--t-drink", "--t-snack", "--t-daily", "--t-season", "--t-meat", "--t-dairy"];
const HH_KEY = "family-shopping-household";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// とまと / トマト / ﾄﾏﾄ を同じものとして扱う
const norm = (s) => String(s || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "")
  .replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
const tagColor = (t) => {
  if (TAG_COLORS[t]) return `var(${TAG_COLORS[t]})`;
  let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `var(${EXTRA_COLORS[h % EXTRA_COLORS.length]})`;
};
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

let items = [];
let loaded = false;
let filterTag = "all";
let query = "";
let household = null;   // { id, geminiKey }
let fs = null, itemsCol = null, hhDoc = null;

/* ---------- 表示 ---------- */
const qtyOf = (it) => Math.max(0, Number(it.qty) || 0);
function allTags() {
  const used = new Set(items.map((i) => i.tag || "その他"));
  const extra = [...used].filter((t) => !DEFAULT_TAGS.includes(t)).sort((a, b) => a.localeCompare(b, "ja"));
  return [...DEFAULT_TAGS, ...extra];
}
function highlight(name) {
  if (!query) return esc(name);
  const i = name.toLowerCase().indexOf(query.toLowerCase());
  if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + query.length)) + "</mark>" + esc(name.slice(i + query.length));
}
function matches(it) {
  if (!query) return true;
  const q = norm(query);
  return norm(it.name).includes(q) || norm(it.tag || "").includes(q);
}

function render() {
  const tags = allTags();
  const counts = {};
  for (const it of items) { const t = it.tag || "その他"; counts[t] = (counts[t] || 0) + 1; }
  if (filterTag !== "all" && !counts[filterTag]) filterTag = "all";

  $("sum").textContent = loaded ? `${items.length}項目 ・ ${items.reduce((s, i) => s + qtyOf(i), 0)}個` : "";
  $("tagbar").innerHTML =
    `<button class="chip" type="button" data-tag="all" aria-pressed="${filterTag === "all"}">すべて <span class="n">${items.length}</span></button>` +
    tags.filter((t) => counts[t]).map((t) =>
      `<button class="chip" type="button" data-tag="${esc(t)}" aria-pressed="${filterTag === t}"><span class="dot" style="--c:${tagColor(t)}"></span>${esc(t)} <span class="n">${counts[t]}</span></button>`
    ).join("");

  if (!loaded) return;
  const visible = items.filter((it) => (filterTag === "all" || (it.tag || "その他") === filterTag) && matches(it));
  if (!items.length) {
    $("list").innerHTML = `<div class="empty"><strong>まだ何もありません</strong>下の「レシートで追加」でレシートを撮ると、買ったものがまとめて入ります。<br>「手で追加」から1つずつ入れることもできます。</div>`;
    return;
  }
  if (!visible.length) {
    $("list").innerHTML = `<div class="empty"><strong>「${esc(query)}」は見つかりません</strong>ほかの言葉で探すか、「手で追加」で新しく入れてください。</div>`;
    return;
  }
  const groups = new Map();
  for (const t of tags) groups.set(t, []);
  for (const it of visible) groups.get(it.tag || "その他").push(it);
  $("list").innerHTML = [...groups].filter(([, rows]) => rows.length).map(([t, rows]) => {
    rows.sort((a, b) => a.name.localeCompare(b.name, "ja"));
    return `<section class="group"><h2><span class="dot" style="--c:${tagColor(t)}"></span>${esc(t)}</h2><div class="rows">` +
      rows.map((it) => {
        const q = qtyOf(it);
        return `<div class="row${q === 0 ? " zero" : ""}" data-id="${esc(it.id)}">
          <button class="name" type="button" data-act="edit"><span>${highlight(it.name)}</span>${q === 0 ? "<small>なくなりました</small>" : ""}</button>
          <div class="stepper">
            <button type="button" data-act="dec" aria-label="${esc(it.name)}を1つ減らす" ${q === 0 ? "disabled" : ""}>−</button>
            <span class="qty" aria-live="polite">${q}</span>
            <button type="button" data-act="inc" aria-label="${esc(it.name)}を1つ増やす">＋</button>
          </div></div>`;
      }).join("") + `</div></section>`;
  }).join("");
}

// 個数は increment で足し引きするので、家族が同時に押してもずれない
function bump(id, d) {
  const it = items.find((i) => i.id === id);
  if (!it || (d < 0 && qtyOf(it) === 0)) return;
  updateDoc(doc(itemsCol, id), { qty: increment(d), updatedAt: serverTimestamp() })
    .catch(() => toast("保存できませんでした。電波を確認してください"));
}

// 同じ名前があれば個数を足し、なければ新しく作る
async function addOrMerge(name, qty, tag) {
  const key = norm(name);
  const hit = items.find((i) => norm(i.name) === key);
  if (hit) {
    await updateDoc(doc(itemsCol, hit.id), { qty: qtyOf(hit) === 0 ? qty : increment(qty), updatedAt: serverTimestamp() });
    return "merged";
  }
  const ref = await addDoc(itemsCol, { name: name.trim(), qty, tag: tag || "その他", createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
  if (!items.some((i) => i.id === ref.id)) items.push({ id: ref.id, name: name.trim(), qty, tag });   // 次の行の重複判定にすぐ使う
  return "added";
}

// 送る前に長い辺 1600px の JPEG に縮める（通信量と待ち時間を減らす）
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
  const buf = new Uint8Array(await blob.arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(bin);
}

class ReadError extends Error { constructor(code) { super(code); this.code = code; } }

async function askGemini(b64, prompt, signal) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`, {
    method: "POST",
    signal,
    headers: { "Content-Type": "application/json", "x-goog-api-key": household.geminiKey },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }],
      generationConfig: { responseMimeType: "application/json", temperature: 0 },
    }),
  });
  if (!res.ok) {
    if (res.status === 400 || res.status === 401 || res.status === 403) throw new ReadError("key");
    if (res.status === 429) throw new ReadError("rate");
    throw new ReadError("server");
  }
  const data = await res.json();
  const text = (data.candidates?.[0]?.content?.parts || []).map((p) => p.text || "").join("");
  try {
    const m = text.match(/\[[\s\S]*\]/);
    return JSON.parse(m ? m[0] : text);
  } catch (e) { throw new ReadError("parse"); }
}

}

}

async function readReceipt(file) {
  rcPreviewUrl = URL.createObjectURL(file);
  $("rcTitle").textContent = "レシートを読み取っています";
  $("rcBody").innerHTML = `<div class="reading"><img class="preview" src="${rcPreviewUrl}" alt="撮影したレシート"><div style="display:flex;gap:10px;align-items:center"><span class="spinner"></span><span>買ったものを探しています。10〜30秒ほどかかります。</span></div></div>`;
  $("rcActions").innerHTML = `<button class="btn" type="button" id="rcStop" style="grid-column:1/-1">中止する</button>`;
  $("rcStop").onclick = closeReceipt;
  $("rcBack").hidden = false;

  const names = items.map((i) => i.name).slice(0, 300);
  const tags = allTags();
  const prompt = [
    "これはスーパーやドラッグストアなどのレシートの写真です。家族の買い物メモに入れるため、買った商品を読み取ってください。",
    "ルール:",
    "- 合計・小計・税・値引き・割引・ポイント・お預かり・お釣り・支払い方法・レジ袋・店名などの行は入れない",
    "- 商品名は、家庭の買い物メモで使う短く一般的な日本語の名前にする（例: 「国産トマト」→「トマト」、「明治おいしい牛乳1000ml」→「牛乳」、「エリエール トイレット12R」→「トイレットペーパー」）",
    "- 今のリストに同じものがあれば、その名前を一字一句そのまま使う。今のリスト: " + (names.length ? names.join("、") : "（まだ空）"),
    "- qty は買った個数。数量欄（「2コ」「×3」「2点」など）があればその数、なければ1。同じ商品が複数行あれば合計する",
    "- tag は次の中から最も合うものを1つ: " + tags.join("、"),
    '答えは JSON の配列だけ。例: [{"name":"トマト","qty":3,"tag":"野菜"},{"name":"牛乳","qty":1,"tag":"乳製品・卵"}]',
    "レシートが写っていない、または読めないときは [] と答える。",
  ].join("\n");

  const ctl = new AbortController();
  rcCtl = ctl;
  try {
    const b64 = await shrink(file);
    const out = await askGemini(b64, prompt, ctl.signal);
    if (ctl.signal.aborted) return;
    rcCtl = null;
    const merged = new Map();
    for (const r of Array.isArray(out) ? out : []) {
      const name = String(r && r.name || "").trim();
      if (!name) continue;
      const qty = Math.max(1, Math.round(Number(r.qty) || 1));
      const tag = tags.includes(r.tag) ? r.tag : "その他";
      const key = norm(name);
      if (merged.has(key)) merged.get(key).qty += qty;
      else merged.set(key, { name, qty, tag, on: true });
    }
    rcRows = [...merged.values()];
    showReceiptResult();
  } catch (e) {
    if (ctl.signal.aborted) return;
    rcCtl = null;
    const msg = {
      key: "レシート読み取りのキーが正しくないようです。設定でキーを入れ直してください。",
      rate: "今日の無料の読み取り回数を使い切ったか、混み合っています。少し時間をおいてからもう一度お試しください。",
      parse: "うまく読み取れませんでした。レシート全体が写るように、明るい場所で撮り直してください。",
      server: "読み取りサービスにつながりませんでした。少し待ってからもう一度お試しください。",
    }[e && e.code] || "読み取りに失敗しました。電波を確認して、もう一度お試しください。";
    showRetry("読み取れませんでした", msg);
  }
}

    rcRows.map((r, i) => `<div class="rline${r.on ? "" : " off"}" data-i="${i}">
      <input type="checkbox" ${r.on ? "checked" : ""} aria-label="${esc(r.name)}を追加する" data-k="on">

      <div class="stepper"><button type="button" data-k="dec" aria-label="1つ減らす">−</button><span class="qty">${r.qty}</span><button type="button" data-k="inc" aria-label="1つ増やす">＋</button></div>
      <div class="rmeta"><select data-k="tag" aria-label="タグ">${tags.map((t) => `<option${t === r.tag ? " selected" : ""}>${esc(t)}</option>`).join("")}</select><span class="rb">${rcBadge(r)}</span></div>
    </div>`).join("") + `</div>`;
  paintRcActions();
}
function paintRcActions() {
  const n = rcRows.filter((r) => r.on && r.name.trim()).length;
  $("rcActions").innerHTML = `<button class="btn" type="button" id="rcClose">やめる</button><button class="btn primary" type="button" id="rcApply" ${n ? "" : "disabled"}>リストに入れる（${n}件）</button>`;

}
$("rcBody").addEventListener("input", (e) => {
  const line = e.target.closest(".rline"); if (!line) return;
  const r = rcRows[+line.dataset.i];
  const k = e.target.dataset.k;
  if (k === "name") { r.name = e.target.value; line.querySelector(".rb").innerHTML = rcBadge(r); paintRcActions(); }
  if (k === "tag") r.tag = e.target.value;
  if (k === "on") { r.on = e.target.checked; line.classList.toggle("off", !r.on); paintRcActions(); }

$("rcBody").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  const line = b.closest(".rline"); const r = rcRows[+line.dataset.i];
  r.qty = Math.max(1, r.qty + (b.dataset.k === "inc" ? 1 : -1));
  line.querySelector(".qty").textContent = r.qty;
  line.querySelector(".rb").innerHTML = rcBadge(r);
});
async function applyReceipt() {
  const rows = rcRows.filter((r) => r.on && r.name.trim());
  $("rcApply").disabled = true; $("rcApply").textContent = "入れています…";
  let added = 0, merged = 0, failed = 0;
  for (const r of rows) {
    try { (await addOrMerge(r.name.trim(), r.qty, r.tag)) === "merged" ? merged++ : added++; }
    catch (e) { failed++; }
  }
  closeReceipt();
  render();
  toast(failed ? `${added + merged}件を入れました（${failed}件は保存できませんでした）` : `新しく${added}件、個数の追加${merged}件を入れました`);
}

  onSnapshot(hhDoc, (snap) => { household.geminiKey = (snap.data() || {}).geminiKey || ""; }, () => {});
  onSnapshot(itemsCol, (snap) => {
    items = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((r) => r.name);
    loaded = true;
    if (!snap.metadata.fromCache) { clearTimeout(loadTimer); notice(""); }
    render();
  }, () => {
    clearTimeout(loadTimer);
    loaded = true;
    notice("リストを読み込めませんでした。招待リンクが正しいか確認してください。");
    render();
  });
  if (isNew) setTimeout(() => { notice(`リストを作りました。<button type="button" id="goInvite">家族を招待する</button>`); const b = $("goInvite"); if (b) b.onclick = openSettings; }, 600);
}

(async function start() {
  if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("ここに")) {
    $("list").innerHTML = `<div class="empty"><strong>まだ設定が終わっていません</strong>config.js に Firebase の設定を入れてください（README の手順2）。</div>`;
    return;
  }
  const app = initializeApp(FIREBASE_CONFIG);
  fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  try { await signInAnonymously(getAuth(app)); }
  catch (e) {
    $("list").innerHTML = `<div class="empty"><strong>接続できませんでした</strong>電波を確認して開き直してください。続く場合は Firebase の「匿名ログイン」が有効か確認してください。</div>`;
    return;
  }
  const fromHash = (location.hash.match(/^#h=([A-Za-z0-9]{20,})$/) || [])[1];
  const id = fromHash || lsGet(HH_KEY);
  if (fromHash) lsSet(HH_KEY, fromHash);
  if (id) openHousehold(id, false); else showWelcome();
})();
</script>
</body>
</html>
